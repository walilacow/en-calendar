<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="恩恩聲播日曆">
<meta name="theme-color" content="#14141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>恩恩聲播日曆</title>
<style>
  :root {
    --bg: #14141c;
    --card: #1e1e2a;
    --card-hover: #252534;
    --accent: #b794f6;
    --accent2: #f6ad55;
    --green: #48bb78;
    --blue: #63b3ed;
    --red: #fc8181;
    --text: #e8e8f0;
    --muted: #8b8b9e;
    --border: #2e2e40;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 14px calc(60px + env(safe-area-inset-bottom, 0px));
  }
  .container { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }

  .month-nav {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 12px;
  }
  .month-nav button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; font-size: 18px; cursor: pointer;
  }
  .month-nav button:hover { background: var(--card-hover); }
  .month-title { font-size: 18px; font-weight: 700; min-width: 140px; text-align: center; }
  .btn-today {
    background: var(--accent); color: #14141c; border: none; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 14px;
    white-space: nowrap; width: auto;
  }
  .month-nav button.btn-today { width: auto; height: 40px; }

  .stats { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat-box {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 4px; text-align: center;
  }
  .stat-box .num { font-size: 18px; font-weight: 700; }
  .stat-box .lab { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-box.g .num { color: var(--green); }
  .stat-box.o .num { color: var(--accent2); }
  .stat-box.p .num { color: var(--accent); }
  .stat-box.b .num { color: var(--blue); }

  .legend {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 12px;
    font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .legend span::before {
    content: ''; display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 5px; vertical-align: middle;
  }
  .legend .l-done::before { background: var(--green); }
  .legend .l-part::before { background: var(--accent2); }
  .legend .l-today::before { background: transparent; border: 2px solid var(--accent); width: 8px; height: 8px; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-head { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0; }
  .cell {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    min-height: 78px; padding: 6px; cursor: pointer; text-align: left;
    color: var(--text); position: relative; transition: background .15s;
    font-family: inherit;
  }
  .cell:hover { background: var(--card-hover); }
  .cell.other { opacity: .3; pointer-events: none; }
  .cell .dnum { font-size: 13px; font-weight: 600; }
  .cell .badge { font-size: 11px; margin-top: 3px; color: var(--muted); }
  .cell .mini-bar {
    height: 4px; background: var(--border); border-radius: 99px;
    margin-top: 5px; overflow: hidden;
  }
  .cell .mini-fill { height: 100%; border-radius: 99px; width: 0; }
  .cell.today { border-color: var(--accent); border-width: 2px; }
  .cell.today .dnum { color: var(--accent); }
  .cell.all-done { border-color: rgba(72,187,120,.55); }
  .cell.all-done > .badge { color: var(--green); }
  .cell.all-done .mini-fill { background: var(--green); }
  .cell.partial .mini-fill { background: var(--accent2); }
  .cell.partial > .badge { color: var(--accent2); }
  .cell .badge.wm { font-size: 10px; margin-top: 2px; }
  .cell.wm-done .badge.wm { color: var(--green); }
  .cell.wm-part .badge.wm { color: var(--accent2); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg); border: 1px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0; width: 100%; max-width: 640px;
    max-height: 88vh; overflow-y: auto; padding: 18px 16px 30px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head h2 { font-size: 18px; }
  .sheet-head .close {
    background: none; border: none; color: var(--muted); font-size: 22px;
    cursor: pointer; padding: 4px 8px;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 10px; padding: 8px 4px;
    font-size: 14px; cursor: pointer; font-weight: 700; text-align: center;
    font-family: inherit;
  }
  .tab .t-sub { display: block; font-size: 11px; font-weight: 400; opacity: .85; margin-top: 2px; }
  .tab.active { background: var(--accent); color: #14141c; border-color: transparent; }

  .day-summary { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.7; }
  .day-summary b { color: var(--text); }
  .day-summary a { color: var(--accent); }
  .day-summary .ok { color: var(--green); font-weight: 700; }
  .day-summary .mid { color: var(--accent2); font-weight: 700; }

  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 12px 10px;
    font-size: 15px; outline: none; min-width: 0;
  }
  .add-row input:focus { border-color: var(--accent); }
  #qtyInput, #ptsInput { max-width: 76px; text-align: center; }
  .btn {
    border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #14141c; white-space: nowrap; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-weight: 400;
  }
  .btn-block { width: 100%; margin-top: 14px; }

  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .task.done { border-color: rgba(72,187,120,.5); }
  .task-top { display: flex; align-items: center; gap: 10px; }
  .task-name { flex: 1; font-weight: 600; font-size: 15px; word-break: break-all; }
  .task.done .task-name { color: var(--green); }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-ctrl button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 17px; cursor: pointer;
  }
  .qty-ctrl button:hover { background: var(--card-hover); }
  .qty-ctrl .minus { color: var(--red); }
  .qty-ctrl .plus {
    width: auto; min-width: 48px; padding: 0 12px;
    background: var(--accent); color: #14141c;
    font-weight: 700; border-color: transparent;
  }
  .qty-ctrl .plus:hover { background: #cba9ff; }
  .task.done .qty-ctrl .plus { background: var(--green); color: #14141c; }
  .qty-ctrl input {
    width: 56px; height: 34px; text-align: center; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-size: 15px; font-weight: 700; outline: none;
  }
  .qty-ctrl input:focus { border-color: var(--accent); }
  .task-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .task.done .task-meta { color: var(--green); }
  .task-bar {
    height: 6px; background: var(--border); border-radius: 99px;
    overflow: hidden; margin-top: 8px;
  }
  .task-fill {
    height: 100%; border-radius: 99px; transition: width .3s ease;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .task.done .task-fill { background: var(--green); }
  .task-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 15px; padding: 4px;
  }
  .task-del:hover { color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; line-height: 1.8; }
  .sheet-foot { margin-top: 14px; display: flex; gap: 10px; }
  .sheet-foot .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--accent); color: #14141c; padding: 10px 20px;
    border-radius: 99px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .cell { min-height: 70px; }
    .cell .badge { font-size: 10px; }
    .stat-box .num { font-size: 15px; }
    .add-row input { font-size: 14px; padding: 12px 8px; }
    .btn { padding: 12px 14px; }
  }
  .pwd-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .pwd-box { text-align: center; padding: 20px; max-width: 320px; width: 100%; }
  .pwd-box h2 { font-size: 20px; margin-bottom: 8px; }
  .pwd-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .pwd-box input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); padding: 14px; font-size: 18px;
    text-align: center; letter-spacing: 6px; outline: none; margin-bottom: 12px;
  }
  .pwd-box input:focus { border-color: var(--accent); }
  .pwd-box .btn { width: 100%; padding: 14px; font-size: 16px; }
  .pwd-err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>
<!-- 登入 -->
<div class="pwd-overlay" id="loginOverlay">
  <div class="pwd-box">
    <h2 id="loginTitle">🔐 聲播日曆</h2>
    <p>登入後資料自動同步雲端，換手機也看得到</p>
    <button class="btn btn-primary" id="googleLoginBtn" style="background:#fff; color:#333; display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
      使用 Google 帳號登入
    </button>
    <div class="pwd-err" id="loginErr"></div>
    <div id="iosTip" style="margin-top:16px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:left; display:none;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div style="font-size:13px; font-weight:700; color:var(--accent2);">💡 iPhone 使用建議</div>
        <button id="iosTipClose" style="background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 2px;">✕</button>
      </div>
      <div style="font-size:13px; color:var(--text); line-height:1.7; margin-top:6px;">
        建議用 <b>Safari</b> 開啟本頁面，登入後點底部分享 ⬆️ →「<b>加入主畫面</b>」，就能像 App 一樣從桌面直接開啟，打卡提醒也比較穩定。
      </div>
    </div>
  </div>
</div>

<div class="container" id="mainContent" style="display:none;">
  <header>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
      <img id="titleAvatar" src="avatars/cat.png" alt="頭像" style="width:38px; height:38px; border-radius:50%; border:2px solid var(--accent); object-fit:cover;">
      <h1 id="appTitle">🎁 聲播日曆</h1>
      <button id="editNickBtn" title="修改暱稱 / 馬甲 / 頭像" style="background:none; border:none; font-size:16px; cursor:pointer; padding:4px; opacity:.8;">✏️</button>
    </div>
    <div class="sub">點日期可設定「每日 / 每週 / 每月」收禮目標（每週從週一起算）・到期自動結算重置・歷史完成數保留</div>
  </header>

  <div class="month-nav">
    <button id="prevMonth" title="上個月">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button id="nextMonth" title="下個月">›</button>
    <button class="btn-today" id="todayBtn">今天</button>
    <button class="btn-today" id="logoutBtn" style="background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 10px 12px; font-size: 13px;">登出</button>
  </div>
  <div style="display:flex; gap:10px; margin-bottom:12px;">
    <button class="btn-today" id="topicBtn" style="background: var(--accent2); flex:1;">🔥 熱門話題</button>
    <button class="btn-today" id="songBtn" style="background: var(--green); flex:1;">🎵 流行歌曲</button>
  </div>

  <div class="stats">
    <div class="stat-box g"><div class="num" id="statFull">0</div><div class="lab">本月全達成</div></div>
    <div class="stat-box o"><div class="num" id="statPart">0</div><div class="lab">部分達成</div></div>
    <div class="stat-box p"><div class="num" id="statWeek">–</div><div class="lab">本週任務</div></div>
    <div class="stat-box b"><div class="num" id="statMonth">–</div><div class="lab">本月任務</div></div>
  </div>

  <div class="legend">
    <span class="l-done">全部達成</span>
    <span class="l-part">部分達成</span>
    <span class="l-today">今天</span>
  </div>

  <div class="cal" id="calGrid"></div>
</div>

<!-- 日面板 -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="close" id="closeSheet">✕</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="day-summary" id="daySummary"></div>
    <div id="customBar" style="display:none; margin-bottom:12px;"></div>
    <div class="add-row">
      <input id="nameInput" type="text" placeholder="任務項目" autocomplete="off">
      <input id="qtyInput" type="number" min="1" value="1" placeholder="數量">
      <input id="ptsInput" type="number" min="0" value="0" placeholder="分數">
      <select id="iconSelect" style="background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px 8px; font-size:14px; outline:none; font-family:inherit;">
        <option value="">🚫 無圖示</option>
        <option value="玫瑰">🌹 玫瑰</option>
        <option value="火箭">🚀 火箭</option>
        <option value="城堡">🏰 城堡</option>
        <option value="金龍">🐉 金龍</option>
        <option value="跑車">🏎️ 跑車</option>
        <option value="飛機">✈️ 飛機</option>
        <option value="遊艇">🛥️ 遊艇</option>
        <option value="鑽戒">💍 鑽戒</option>
        <option value="皇冠">👑 皇冠</option>
        <option value="煙花">🎆 煙花</option>
        <option value="愛心">❤️ 愛心</option>
        <option value="禮物盒">🎁 禮物盒</option>
      </select>
      <button class="btn btn-primary" id="addBtn">新增</button>
    </div>
    <div id="giftPickRow" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">
      <button class="gift-pick" data-name="玫瑰" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🌹 玫瑰</button>
      <button class="gift-pick" data-name="火箭" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🚀 火箭</button>
      <button class="gift-pick" data-name="城堡" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🏰 城堡</button>
      <button class="gift-pick" data-name="金龍" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🐉 金龍</button>
      <button class="gift-pick" data-name="跑車" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🏎️ 跑車</button>
      <button class="gift-pick" data-name="飛機" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">✈️ 飛機</button>
      <button class="gift-pick" data-name="遊艇" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🛥️ 遊艇</button>
      <button class="gift-pick" data-name="鑽戒" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">💍 鑽戒</button>
      <button class="gift-pick" data-name="皇冠" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">👑 皇冠</button>
      <button class="gift-pick" data-name="煙花" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🎆 煙花</button>
      <button class="gift-pick" data-name="愛心" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">❤️ 愛心</button>
      <button class="gift-pick" data-name="禮物盒" style="background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--text); font-family:inherit;">🎁 禮物盒</button>
    </div>
    <div class="task-list" id="taskList"></div>
    <div class="note-box" id="timeBox" style="margin-top:14px; display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="font-size:13px; color:var(--muted);">🎙️ 開播時間（開始 ～ 結束）</label>
        <button id="clearTimeBtn" style="background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:2px 4px;">✕ 清除</button>
      </div>
      <div id="slotList"></div>
      <button id="addSlotBtn" style="width:100%; background:var(--card); border:1px dashed var(--border); color:var(--muted); border-radius:10px; padding:10px; font-size:14px; cursor:pointer; font-family:inherit;">＋ 新增時段</button>
    </div>
    <div class="note-box" id="specialBox" style="margin-top:14px; display:none;">

  // ---------- 主播暱稱 / 馬甲 / 頭像 ----------
  const AVATARS = [
    ['cat', '貓'], ['dog', '狗'], ['rabbit', '兔'], ['bear', '熊'],
    ['fox', '狐'], ['panda', '熊貓'], ['owl', '貓頭鷹'], ['unicorn', '獨角獸']
  ];
  let nickname = localStorage.getItem('nick_v1') || '';
  let alias = localStorage.getItem('alias_v1') || '';
  let avatarKey = localStorage.getItem('avatar_v1') || 'cat';
  let avatarData = localStorage.getItem('avatarData_v1') || ''; // 自訂頭像（壓縮後 base64）

  // 取得目前頭像 URL（自訂優先，其次預設圖）
  function avatarURL() {
    return avatarData || AVATAR_IMG[avatarKey] || AVATAR_IMG.cat;
  }

  $('avatarFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('圖片太大（上限 5MB）'); e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // 壓縮到 256x256 JPEG
        const S = 256;
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        const c = cv.getContext('2d');
        const side = Math.min(img.width, img.height);
        c.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        let data = cv.toDataURL('image/jpeg', 0.85);
        // 保險：若超過 200KB 再降品質
        let q = 0.85;
        while (data.length > 200 * 1024 && q > 0.4) {
          q -= 0.15;
          data = cv.toDataURL('image/jpeg', q);
        }
        if (data.length > 300 * 1024) { toast('圖片壓縮後仍過大，請換一張'); return; }
        avatarData = data;
        try { localStorage.setItem('avatarData_v1', data); } catch (e) { /* 本機容量滿也不中斷 */ }
        if (fbOk && currentUid) {
          db.collection('users').doc(currentUid).set({ avatarData: data }, { merge: true }).catch(() => {});
        }
        renderAvatarPicker();
        applyNick();
        toast('✅ 頭像已更新');
      };
      img.onerror = () => toast('無法讀取圖片');
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    e.target.value = '';
  });

  function renderAvatarPicker() {
    const row = $('avatarPickRow');
    row.innerHTML = '';
    AVATARS.forEach(([key, label]) => {
      const b = document.createElement('button');
      const on = key === avatarKey;
      b.style.cssText = 'background:' + (on ? 'var(--accent)' : 'var(--bg)') + '; border:2px solid ' + (on ? 'var(--accent)' : 'var(--border)') + '; border-radius:50%; padding:3px; cursor:pointer;';
      b.innerHTML = '<img src="' + (AVATAR_IMG[key] || '') + '" style="width:52px;height:52px;border-radius:50%;display:block;">';
      b.title = label;
      b.onclick = () => { avatarKey = key; avatarData = ''; renderAvatarPicker(); };
      row.appendChild(b);
    });
    // 上傳自訂頭像按鈕
    const up = document.createElement('button');

    up.style.cssText = 'background:' + (hasCustom ? 'var(--accent)' : 'var(--bg)') + '; border:2px dashed ' + (hasCustom ? 'var(--accent)' : 'var(--border)') + '; border-radius:50%; width:58px; height:58px; cursor:pointer; color:var(--muted); font-size:22px;';
    up.textContent = '⬆️';
    up.title = '上傳自訂頭像';

    if (avatarData) {

      c.textContent = '✕';
      c.title = '清除自訂頭像';
      c.onclick = () => { avatarData = ''; localStorage.removeItem('avatarData_v1'); renderAvatarPicker(); };
      row.appendChild(c);

  }
  function applyNick() {

    document.title = n ? n + '聲播日曆' : '聲播日曆';
    $('appTitle').textContent = n ? '🎁 ' + n + '聲播日曆' : '🎁 聲播日曆';

  applyNick();

  $('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('aliasInput').focus(); });
  $('aliasInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('nickOk').click(); });
  $('aliasPickRow').addEventListener('click', (e) => {

    $('aliasInput').value = alias;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        return { dates: s.dates || {}, weeks: s.weeks || {}, months: s.months || {}, ranges: s.ranges || {} };
      }
    } catch (e) {}
    return { dates: {}, weeks: {}, months: {}, ranges: {} };
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); scheduleCloudSave(); }

  function key(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function todayKey() { const n = new Date(); return key(n.getFullYear(), n.getMonth(), n.getDate()); }

  // 週一為一週的開始
  function mondayOf(y, m, d) {
    const dt = new Date(y, m, d);
    dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
    return dt;
  }
  function scopeKey(sc, ds) {
    if (sc === 'day') return ds;
    if (sc === 'week') {
      const [y, m, d] = ds.split('-').map(Number);
      const mon = mondayOf(y, m - 1, d);
      return key(mon.getFullYear(), mon.getMonth(), mon.getDate());
    }
    return ds.slice(0, 7); // YYYY-MM
  }
  const BUCKET = { day: 'dates', week: 'weeks', month: 'months' };
  function getTasks(sc, ds) {
    if (sc === 'custom') {
      const r = customId && store.ranges ? store.ranges[customId] : null;
      return (r && r.tasks) || [];
    }
    const k = scopeKey(sc, ds);
    const b = store[BUCKET[sc]][k];
    return (b && b.tasks) || [];
  }
  function ensureBucket(sc, ds) {
    if (sc === 'custom') {
      if (!store.ranges) store.ranges = {};
      if (!store.ranges[customId]) store.ranges[customId] = { name: '', start: '', end: '', tasks: [] };
      return store.ranges[customId];
    }
    const k = scopeKey(sc, ds);
    if (!store[BUCKET[sc]][k]) store[BUCKET[sc]][k] = { tasks: [] };
    return store[BUCKET[sc]][k];
  }
  function calc(tasks) {
    const doneCnt = tasks.filter(t => t.cur >= t.target).length;
    const totUnits = tasks.reduce((s, t) => s + t.target, 0);
    const doneUnits = tasks.reduce((s, t) => s + Math.min(t.cur, t.target), 0);
    const scoreTotal = tasks.reduce((s, t) => s + (t.score || 0), 0);
    const scoreEarned = tasks.reduce((s, t) => s + (t.cur >= t.target ? (t.score || 0) : 0), 0);
    const pct = totUnits ? Math.round(doneUnits / totUnits * 100) : 0;
    return { doneCnt, total: tasks.length, totUnits, doneUnits, pct, scoreTotal, scoreEarned, allDone: tasks.length > 0 && doneCnt === tasks.length };
  }

  // ---------- 月曆 ----------
  function renderCalendar() {
    $('monthTitle').textContent = `${viewYear} 年 ${viewMonth + 1} 月`;
    const grid = $('calGrid');
    grid.innerHTML = '';
    WEEK.forEach(w => {
      const h = document.createElement('div');
      h.className = 'cal-head'; h.textContent = w;
      grid.appendChild(h);
    });

    const first = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const tKey = todayKey();

    for (let i = 0; i < first; i++) {
      const c = document.createElement('div');
      c.className = 'cell other';
      grid.appendChild(c);
    }

    let statFull = 0, statPart = 0;

    for (let d = 1; d <= daysInMonth; d++) {
      const ds = key(viewYear, viewMonth, d);
      const tasks = getTasks('day', ds);
      const r = calc(tasks);
      const cell = document.createElement('button');
      cell.className = 'cell';

      if (ds === tKey) cell.classList.add('today');
      if (r.allDone) { cell.classList.add('all-done'); statFull++; }
      else if (r.doneUnits > 0) { cell.classList.add('partial'); statPart++; }

      let inner = `<div class="dnum">${d}</div>`;
      const stB = store.dates[ds];
      if (stB && stB.slots && stB.slots.length) {
        const slotTxt = stB.slots.map(sl => sl.start + (sl.end ? '–' + sl.end : '')).filter(Boolean).join(' ');
        if (slotTxt) inner += `<div class="badge">🎙️ ${slotTxt}</div>`;
      }
      if (tasks.length) {
        inner += `<div class="badge">${r.doneCnt}/${tasks.length} 任務・${r.doneUnits}/${r.totUnits} 個</div>
                  <div class="mini-bar"><div class="mini-fill" style="width:${r.pct}%"></div></div>`;
      }

      // 週 / 月任務標示
      const wt = getTasks('week', ds), wr = calc(wt);
      const mt = getTasks('month', ds), mr = calc(mt);
      if (wt.length || mt.length) {
        const parts = [];
        if (wt.length) parts.push(`週 ${wr.doneCnt}/${wt.length}`);
        if (mt.length) parts.push(`月 ${mr.doneCnt}/${mt.length}`);
        inner += `<div class="badge wm">${parts.join('・')}</div>`;
        const wOk = !wt.length || wr.allDone;
        const mOk = !mt.length || mr.allDone;
        if (wt.length && mt.length ? (wr.allDone && mr.allDone) : (wr.allDone || mr.allDone)) cell.classList.add('wm-done');
        else if (!wOk || !mOk) cell.classList.add(wr.doneUnits > 0 || mr.doneUnits > 0 ? 'wm-part' : '');
      }

      if (store.ranges) {
        let cDone = 0, cTot = 0;
        Object.keys(store.ranges).forEach(id => {
          const rg = store.ranges[id];
          if (rg.start && rg.end && ds >= rg.start && ds <= rg.end) {
            const rc = calc(rg.tasks || []);
            cDone += rc.doneCnt; cTot += rc.total;
          }
        });
        if (cTot) inner += `<div class="badge wm">區間 ${cDone}/${cTot}</div>`;
      }
      cell.innerHTML = inner;
      cell.onclick = () => openDay(ds);
      grid.appendChild(cell);
    }

    $('statFull').textContent = statFull;
    $('statPart').textContent = statPart;
    const wr = calc(getTasks('week', tKey));
    $('statWeek').textContent = wr.total ? `${wr.doneCnt}/${wr.total}` : '–';
    const mr = calc(getTasks('month', tKey));
    $('statMonth').textContent = mr.total ? `${mr.doneCnt}/${mr.total}` : '–';
  }

  // ---------- 日面板 ----------
  function openDay(ds) {
    openDate = ds;
    scope = 'day';
    renderSheet();
    $('overlay').classList.add('open');
    setTimeout(() => $('nameInput').focus(), 250);
  }
  function closeSheet() {
    openDate = null;
    $('overlay').classList.remove('open');
    renderCalendar();
  }

  function renderTabs() {
    const tabs = $('tabs');
    tabs.innerHTML = '';
    [['day', '每日'], ['week', '每週'], ['month', '每月'], ['custom', '自訂']].forEach(([sc, label]) => {
      const r = calc(getTasks(sc, openDate));
      const b = document.createElement('button');
      b.className = 'tab' + (scope === sc ? ' active' : '');
      b.innerHTML = `${label}<span class="t-sub">${r.total ? r.doneCnt + '/' + r.total + ' 任務' : '無目標'}</span>`;
      b.onclick = () => { scope = sc; renderSheet(); };
      tabs.appendChild(b);
    });
  }

  function renderSheet() {
    if (!openDate) return;
    const [y, m, d] = openDate.split('-').map(Number);
    const tKey = todayKey();

    if (scope === 'day') {
      const week = WEEK[new Date(y, m - 1, d).getDay()];
      const rel = openDate === tKey ? '・今天' : (openDate < tKey ? '・已結算' : '・未來');
      $('sheetTitle').textContent = `${m} 月 ${d} 日（週${week}）${rel}`;
    } else if (scope === 'week') {
      const mon = mondayOf(y, m - 1, d);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const cur = scopeKey('week', tKey), mine = scopeKey('week', openDate);
      const rel = mine === cur ? '・本週' : (mine < cur ? '・已結算' : '・未來');
      $('sheetTitle').textContent =
        `本週 ${mon.getMonth() + 1}/${mon.getDate()}（一）– ${sun.getMonth() + 1}/${sun.getDate()}（日）${rel}`;
    } else if (scope === 'custom') {
      const r = customId && store.ranges ? store.ranges[customId] : null;
      $('sheetTitle').textContent = r ? `${r.name}（${r.start}～${r.end}）` : '自訂任務區間';
    } else {
      const cur = tKey.slice(0, 7), mine = openDate.slice(0, 7);
      const rel = mine === cur ? '・本月' : (mine < cur ? '・已結算' : '・未來');
      $('sheetTitle').textContent = `${y} 年 ${m} 月${rel}`;
    }

    renderTabs();

    // 自訂區間列
    const customBar = $('customBar');
    if (scope === 'custom') {
      customBar.style.display = 'block';
      if (!store.ranges) store.ranges = {};
      const ids = Object.keys(store.ranges);
      if (!customId || !store.ranges[customId]) customId = ids[0] || null;
      let bar = '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">';
      ids.forEach(id => {
        const rg = store.ranges[id];
        const rc = calc(rg.tasks || []);
        const on = id === customId;
        bar += `<button class="rng-chip" data-id="${id}" style="background:${on ? 'var(--accent)' : 'var(--card)'}; color:${on ? '#14141c' : 'var(--muted)'}; border:1px solid var(--border); border-radius:99px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit;">${rg.name}（${rg.start}～${rg.end}）${rc.doneCnt}/${rc.total}</button>`;
      });
      bar += '<button id="rngAdd" style="background:none; border:1px dashed var(--border); color:var(--muted); border-radius:99px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit;">＋ 新增區間</button></div>';
      if (showCreateRange) {
        bar += `<div style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;">
          <input id="rngName" type="text" placeholder="區間名稱（例如：中秋活動）" style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-size:14px; outline:none; margin-bottom:8px; font-family:inherit;">
          <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
            <input id="rngStart" type="date" style="flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-size:14px; outline:none; color-scheme:dark; font-family:inherit;">
            <span style="color:var(--muted);">～</span>
            <input id="rngEnd" type="date" style="flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-size:14px; outline:none; color-scheme:dark; font-family:inherit;">
          </div>
          <button id="rngCreate" class="btn btn-primary" style="width:100%; padding:10px; font-size:14px;">建立區間</button>
        </div>`;
      }
      customBar.innerHTML = bar;
    } else {
      customBar.style.display = 'none';
    }

    const tasks = getTasks(scope, openDate);
    const r = calc(tasks);
    let status;
    if (!tasks.length) status = '尚未新增目標';
    else if (r.allDone) status = `<span class="ok">🎉 全部達成</span>`;
    else if (r.doneUnits > 0) status = `<span class="mid">部分達成</span>`;
    else status = '進行中';

    const notes = {
      day: '過了午夜 12 點後自動結算，新的一天從 0 重新開始。',
      week: '每週從禮拜一開始，週一自動結算上週並重新計算。',
      month: '每月 1 號自動結算上月並重新計算。',
      custom: '自訂區間：進度累計到結束日，結束後保留為紀錄。'
    };
    $('daySummary').innerHTML =
      `任務達成 <b>${r.doneCnt}/${r.total}</b> ・ 收禮進度 <b>${r.pct}%</b>（${r.doneUnits}/${r.totUnits} 個）・ 分數 <b>${r.scoreEarned}/${r.scoreTotal}</b> ・ ${status}<br>${notes[scope]}`;

    const labels = {
      day: ['📋 複製前一天任務', '🗑 清空這天'],
      week: ['📋 複製上一週', '🗑 清空本週'],
      month: ['📋 複製上一月', '🗑 清空本月'],
      custom: ['📋 複製區間（不支援）', '🗑 刪除這個區間']
    };
    $('copyPrevBtn').textContent = labels[scope][0];
    $('clearDayBtn').textContent = labels[scope][1];

    // 每日趣事（僅每日分頁顯示）
    const noteBox = $('noteBox');
    const spBox = $('specialBox');
    if (scope === 'day') {
      $('timeBox').style.display = 'block';
      const tb = ensureBucket('day', openDate);
      if (!tb.slots && tb.startTime) {
        tb.slots = [{ start: tb.startTime, end: tb.endTime || '' }];
        delete tb.startTime; delete tb.endTime; save();
      }
      const slots = tb.slots || [];
      const slotList = $('slotList');
      slotList.innerHTML = '';
      slots.forEach((sl, i) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; gap:8px; align-items:center; margin-bottom:8px;';
        row.innerHTML = `
          <input type="time" class="slot-start" data-slot="${i}" value="${sl.start || ''}" style="flex:1; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px; font-size:16px; font-family:inherit; outline:none; color-scheme:dark;">
          <span style="color:var(--muted); font-size:14px;">～</span>
          <input type="time" class="slot-end" data-slot="${i}" value="${sl.end || ''}" style="flex:1; min-width:0; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px; font-size:16px; font-family:inherit; outline:none; color-scheme:dark;">
          <button class="slot-del" data-slot="${i}" title="刪除時段" style="background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:4px 6px;">✕</button>`;
        slotList.appendChild(row);
      });
      noteBox.style.display = 'block';
      $('noteInput').value = (store.dates[openDate] && store.dates[openDate].note) || '';
      // 幸運開出統計
      spBox.style.display = 'block';
      const sp = (store.dates[openDate] && store.dates[openDate].special) || { dragon: 0, castle: 0 };
      spBox.querySelectorAll('.sp-count').forEach(el => { el.textContent = sp[el.dataset.k] || 0; });
    } else {
      $('timeBox').style.display = 'none';
      noteBox.style.display = 'none';
      spBox.style.display = 'none';
    }

    const list = $('taskList');
    list.innerHTML = '';
    if (!tasks.length) {
      list.innerHTML = '<div class="empty">還沒有目標<br>在上方輸入「項目」「數量」「分數」開始新增</div>';
      return;
    }
    tasks.forEach((t, idx) => {
      const isDone = t.cur >= t.target;
      const tpct = Math.round(Math.min(t.cur, t.target) / t.target * 100);
      const div = document.createElement('div');
      div.className = 'task' + (isDone ? ' done' : '');
      div.innerHTML = `
        <div class="task-top">
          <span class="task-name"></span>
          <div class="qty-ctrl">
            <button class="minus" data-idx="${idx}" title="少一個">−</button>
            <input type="number" min="0" value="${t.cur}" data-idx="${idx}" aria-label="完成數量">
            <button class="plus" data-idx="${idx}" title="收到一個，+1">+1</button>
          </div>
          <button class="task-del" data-idx="${idx}" title="刪除">✕</button>
        </div>
        <div class="task-meta">目標 ${t.target} 個 ・ 已收 ${t.cur} 個（${tpct}%）・ ${t.score || 0} 分${isDone ? ' ・ ✅ 達成' : ''}</div>
        <div class="task-bar"><div class="task-fill" style="width:${tpct}%"></div></div>
      `;

  function checkReminders() {
    const now = new Date();
    const tk = todayKey();
    const b = store.dates[tk];
    if (!b || !b.slots || !b.slots.length) return;
    const cur = now.getHours() * 60 + now.getMinutes();
    const toMin = s => { const p = s.split(':'); return (+p[0]) * 60 + (+p[1]); };
    const flags = reminded[tk] || (reminded[tk] = []);
    b.slots.forEach((sl, i) => {
      const f = flags[i] || (flags[i] = {});
      if (sl.start && !f.start && cur >= toMin(sl.start)) {
        f.start = true; saveReminded(reminded);
        fireRemind('🎙️ 開播打卡', '第 ' + (i + 1) + ' 場開播時間到了，記得打卡！');
      }
      if (sl.end && !f.end && cur >= toMin(sl.end) - 5) {
        f.end = true; saveReminded(reminded);
        fireRemind('🎙️ 下播打卡', '第 ' + (i + 1) + ' 場再 5 分鐘下播，記得打卡！');
      }
    });
  }
  setInterval(checkReminders, 30000);
  setTimeout(checkReminders, 2000);


  // ---------- 分享圖卡 ----------
  let lastCardBlob = null;

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function makeCard(cb) {
    const tasks = getTasks(scope, openDate);
    const r = calc(tasks);
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    const FONT = '\'PingFang TC\', \'Noto Sans TC\', sans-serif';

    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1c1c2b'); g.addColorStop(1, '#14141c');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    roundRect(c, 60, 60, W - 120, H - 120, 40);
    c.fillStyle = '#1e1e2a'; c.fill();
    c.strokeStyle = '#b794f6'; c.lineWidth = 4; c.stroke();

    c.textAlign = 'center';
    c.fillStyle = '#e8e8f0';
    c.font = 'bold 56px ' + FONT;
    c.fillText((nickname ? nickname : '') + '聲播日曆 🎁', W / 2, 175);

    const py = Number(openDate.slice(0, 4)), pm = Number(openDate.slice(5, 7)), pd = Number(openDate.slice(8, 10));
    const week = WEEK[new Date(py, pm - 1, pd).getDay()];
    c.fillStyle = '#8b8b9e';
    c.font = '34px ' + FONT;
    c.fillText(py + ' 年 ' + pm + ' 月 ' + pd + ' 日（週' + week + '）', W / 2, 240);

    // 虛擬頭像（左上）
    const drawAvatar = (img) => {
      if (img && img.width) {
        c.save();
        c.beginPath(); c.arc(150, 155, 70, 0, Math.PI * 2); c.closePath();
        c.fillStyle = '#2e2e40'; c.fill();
        c.clip();
        c.drawImage(img, 150 - 70, 155 - 70, 140, 140);
        c.restore();
        c.beginPath(); c.arc(150, 155, 72, 0, Math.PI * 2);
        c.strokeStyle = '#b794f6'; c.lineWidth = 6; c.stroke();
      }
      finishCard(c, r, tasks);
      cb(cv);
    };
    const avImg = new Image();
    avImg.onload = () => drawAvatar(avImg);
    avImg.onerror = () => drawAvatar(null);
    avImg.src = avatarURL();
  }

  function finishCard(c, r, tasks) {
    const FONT = '\'PingFang TC\', \'Noto Sans TC\', sans-serif';
    const W = 1080, H = 1350;
    c.textAlign = 'center';
    c.fillStyle = '#b794f6';
    c.font = 'bold 150px ' + FONT;
    c.fillText(r.pct + '%', W / 2, 435);
    c.fillStyle = '#8b8b9e';
    c.font = '34px ' + FONT;
    c.fillText('任務達成 ' + r.doneCnt + '/' + r.total + ' ・ 分數 ' + r.scoreEarned + '/' + r.scoreTotal, W / 2, 500);

    const bx = 140, bw = W - 280, by = 545;
    roundRect(c, bx, by, bw, 24, 12); c.fillStyle = '#2e2e40'; c.fill();
    if (r.pct > 0) {
      roundRect(c, bx, by, Math.max(24, bw * r.pct / 100), 24, 12);
      const pg = c.createLinearGradient(bx, 0, bx + bw, 0);
      pg.addColorStop(0, '#b794f6'); pg.addColorStop(1, '#f6ad55');
      c.fillStyle = pg; c.fill();
    }

    let ty = 672;
    const mark = alias || '💛';
    tasks.slice(0, 8).forEach(t => {
      const done = t.cur >= t.target;
      roundRect(c, 110, ty - 52, W - 220, 78, 18);
      c.fillStyle = done ? 'rgba(72,187,120,.13)' : 'rgba(46,46,64,.55)';
      c.fill();
      c.textAlign = 'left';
      c.fillStyle = done ? '#48bb78' : '#e8e8f0';
      c.font = 'bold 40px ' + FONT;
      c.fillText((done ? mark + ' ' : '⬜ ') + t.name, 150, ty);
      c.textAlign = 'right';
      c.fillStyle = done ? '#48bb78' : '#8b8b9e';
      c.font = 'bold 40px ' + FONT;
      c.fillText(t.cur + '/' + t.target, W - 150, ty);
      ty += 92;
    });

    c.textAlign = 'center';
    c.fillStyle = '#5a5a70';
    c.font = '28px ' + FONT;
    c.fillText('聲播日曆', W / 2, H - 105);
  }

  $('giftPickRow').addEventListener('click', (e) => {
    const b = e.target.closest('.gift-pick');
    if (!b) return;
    $('nameInput').value = b.dataset.name;
    $('qtyInput').focus();
  });

  $('cardBtn').onclick = () => {
    if (!openDate) return;
    if (!getTasks(scope, openDate).length) { toast('還沒有任務，無法產生圖卡'); return; }
    makeCard((cv) => {
    cv.toBlob((blob) => {
      if (!blob) { toast('產生圖卡失敗'); return; }
      lastCardBlob = blob;
      $('cardImg').src = URL.createObjectURL(blob);
      $('cardMsg').textContent = '';
      $('cardOverlay').classList.add('open');
    }, 'image/png');
    });
  };
  $('cardDownload').onclick = () => {
    if (!lastCardBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastCardBlob);
    a.download = 'shengbo-card.png';
    document.body.appendChild(a); a.click(); a.remove();
    $('cardMsg').textContent = '已下載，到相簿查看';
  };
  $('cardShare').onclick = async () => {
    if (!lastCardBlob) return;
    const file = new File([lastCardBlob], 'shengbo-card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '聲播日曆' }); } catch (e) {}
    } else {
      $('cardMsg').textContent = '此裝置不支援直接分享，請用「存到相簿」再手動發';
    }
  };
  $('closeCard').onclick = () => $('cardOverlay').classList.remove('open');
  $('cardOverlay').addEventListener('click', (e) => { if (e.target === $('cardOverlay')) $('cardOverlay').classList.remove('open'); });

  renderCalendar();
})();
</script>
</body>
</html>
