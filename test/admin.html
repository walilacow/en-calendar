<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14141c">
<title>主播收禮狀況・後台</title>
<style>
  :root { --bg:#14141c; --card:#1e1e2a; --border:#2e2e40; --accent:#b794f6; --accent2:#f6ad55; --green:#48bb78; --blue:#63b3ed; --red:#fc8181; --text:#e8e8f0; --muted:#8b8b9e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"PingFang TC","Noto Sans TC",sans-serif; min-height:100vh; padding:20px 14px 60px; }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:340px; margin:60px auto; text-align:center; }
  .btn { border:none; border-radius:10px; padding:12px 18px; font-size:15px; cursor:pointer; font-weight:700; background:var(--accent); color:#14141c; width:100%; font-family:inherit; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .logging { color:var(--accent2); font-size:13px; margin-top:10px; }
  #who { color:var(--green); font-size:13px; margin-bottom:14px; }
  .period-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .period-tabs button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:14px; cursor:pointer; font-family:inherit; font-weight:700; }
  .period-tabs button.on { background:var(--accent); color:#14141c; border-color:transparent; }
  .cards { display:flex; flex-direction:column; gap:14px; }
  .host-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .host-card h3 { font-size:17px; margin-bottom:2px; }
  .host-card .email { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .nums { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .num { flex:1; min-width:120px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .num .v { font-size:20px; font-weight:800; }
  .num .l { font-size:11px; color:var(--muted); margin-top:2px; }
  .c-sales { color:var(--accent2); } .c-tasks { color:var(--accent); } .c-total { color:var(--green); }
  .bar-wrap { margin-top:6px; }
  .bar-row { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin-top:4px; }
  .bar-row .track { flex:1; height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
  .bar-row .fill { height:100%; border-radius:99px; }
  .f-s { background:var(--accent2); } .f-t { background:var(--accent); } .f-h { background:var(--blue); }
  .hours-line { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; }
  .hours-line b.h { color:var(--blue); font-size:16px; }
  .hours-line b.p { color:var(--green); font-size:16px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; font-size:14px; line-height:2; }
  .muted { color:var(--muted); font-size:12px; }
  .updated { color:var(--muted); font-size:11px; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap" id="appWrap" style="display:none;">
  <h1>🎁 主播收禮狀況</h1>
  <div class="sub">聲播日曆・測試環境後台（資料即時同步自各主播的 App・業績＋任務分數）</div>
  <div id="who"></div>
  <div class="period-tabs">
    <button id="tabWeek" class="on">本週</button>
    <button id="tabMonth">本月</button>
  </div>
  <select id="weekSelect" style="width:100%;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:14px;outline:none;font-family:inherit;"></select>
  <select id="monthSelect" style="display:none;width:100%;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font-size:14px;outline:none;font-family:inherit;"></select>
  <div class="cards" id="cards"></div>
  <div style="margin-top:18px;"><button class="btn" onclick="location.reload()">🔄 重新整理</button></div>
</div>

<div id="taskModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:16px;">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;">
      <h3 id="taskModalTitle" style="font-size:16px;"></h3>
      <button id="taskModalClose" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <div id="taskModalBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<div class="login-box" id="loginBox">
  <h1 style="margin-bottom:8px;">🔐 後台登入</h1>
  <div class="sub" style="margin-bottom:16px;">請用管理者 Google 帳號登入</div>
  <div style="display:flex;justify-content:center;min-height:44px;"><div id="gsiBtn"></div></div>
  <div class="logging" id="loggingTip" style="display:none;margin-top:10px;">登入處理中…</div>
  <div class="err" id="err"></div>
  <button class="btn" id="fallbackBtn" style="margin-top:12px;background:var(--card);color:var(--text);border:1px solid var(--border);font-size:13px;padding:10px;">🔁 改用傳統登入（跳轉 Safari）</button>
  <div class="muted" style="margin-top:10px;font-size:11px;line-height:1.6;">若持續「已封鎖存取權」→ Firebase Console → Authentication → Settings → Authorized domains 加入此網域</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FB_CONFIG = {"apiKey":"AIzaSyClGhrZrcjfzHBhSiSUWDuZk9OqnXCPY_M","authDomain":"en-calendar-dbb36.firebaseapp.com","projectId":"en-calendar-dbb36","storageBucket":"en-calendar-dbb36.firebasestorage.app","messagingSenderId":"759675780359","appId":"1:759675780359:web:5040f38da2dd71ea4019a2"};
firebase.initializeApp(FB_CONFIG);
var auth = firebase.auth(), db = firebase.firestore();
var period = 'week';
var unsubscribe = null;

// Google 一鍵登入（PWA 主畫面模式唯一可靠做法：不跳轉、不彈窗）
function renderGISButton(){
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
    setTimeout(renderGISButton, 500); return;
  }
  google.accounts.id.initialize({
    client_id: '759675780359-smbje4ich9p4kga635g06lios33n9vvl.apps.googleusercontent.com',
    callback: function(resp){
      document.getElementById('err').textContent = '';
      document.getElementById('loggingTip').style.display = 'block';
      var cred = firebase.auth.GoogleAuthProvider.credential(resp.credential);
      auth.signInWithCredential(cred).catch(function(e){
        document.getElementById('loggingTip').style.display = 'none';
        document.getElementById('err').textContent = (e && e.message) ? e.message : '登入失敗';
      });
    }
  });
  google.accounts.id.renderButton(document.getElementById('gsiBtn'), {
    theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with'
  });
}
renderGISButton();
// 備用：傳統 redirect 登入（PWA 可能跳去 Safari，但 Safari 登完能跳回來）
document.getElementById('fallbackBtn').onclick = function(){
  document.getElementById('err').textContent = '';
  document.getElementById('loggingTip').style.display = 'block';
  document.getElementById('loggingTip').textContent = '即將跳轉到 Google 登入…完成後會自動跳回';
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider).catch(function(e){
    document.getElementById('loggingTip').style.display = 'none';
    document.getElementById('err').textContent = e.message || '登入失敗';
  });
};
auth.getRedirectResult().then(function(res){
  if (res && res.user) {
    document.getElementById('fallbackBtn').disabled = true;
    document.getElementById('fallbackBtn').textContent = '✅ 登入成功，載入中…';
  }
}).catch(function(e){
  document.getElementById('loggingTip').style.display = 'none';
  document.getElementById('err').textContent = (e && e.message) ? e.message : '登入失敗';
});

document.getElementById('tabWeek').onclick = function(){ setPeriod('week'); };
document.getElementById('tabMonth').onclick = function(){ setPeriod('month'); };
function setPeriod(p){
  period = p;
  document.getElementById('tabWeek').className = p === 'week' ? 'on' : '';
  document.getElementById('tabMonth').className = p === 'month' ? 'on' : '';
  document.getElementById('weekSelect').style.display = p === 'week' ? 'block' : 'none';
  document.getElementById('monthSelect').style.display = p === 'month' ? 'block' : 'none';
  render();
}

// 週選單：本週＋前 3 週
var weekOffset = 0;
function populateWeekSelect(){
  var sel = document.getElementById('weekSelect');
  sel.innerHTML = '';
  var now = new Date();
  var thisStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  for (var i = 0; i < 4; i++) {
    var s = new Date(thisStart); s.setDate(thisStart.getDate() - 7 * i);
    var e = new Date(s); e.setDate(s.getDate() + 6);
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = (i === 0 ? '本週・' : '') + (s.getMonth()+1) + '/' + s.getDate() + '~' + (e.getMonth()+1) + '/' + e.getDate();
    sel.appendChild(opt);
  }
  sel.value = weekOffset;
}
document.getElementById('weekSelect').onchange = function(){
  weekOffset = Number(this.value) || 0;
  render();
};
populateWeekSelect();

// 月份選單：本月＋前 3 個月
var monthOffset = 0;
function populateMonthSelect(){
  var sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  var now = new Date();
  for (var i = 0; i < 4; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = (i === 0 ? '本月・' : '') + d.getFullYear() + '年' + (d.getMonth()+1) + '月';
    sel.appendChild(opt);
  }
  sel.value = monthOffset;
}
document.getElementById('monthSelect').onchange = function(){
  monthOffset = Number(this.value) || 0;
  render();
};
populateMonthSelect();

auth.onAuthStateChanged(function(user){
  if (!user) return;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  document.getElementById('who').textContent = '已登入：' + (user.email || user.uid);
  startListen();
});

function key(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

function rangeOf(period){
  var now = new Date();
  if (period === 'month') {
    var base = new Date(now.getFullYear(), now.getMonth() - monthOffset, 1);
    var days = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    var labels = [];
    for (var i = 1; i <= days; i++) labels.push(String(i));
    return { days: days, labels: labels, base: base };
  }
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - 7 * weekOffset);
  var labels = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(start); d.setDate(start.getDate() + i);
    labels.push((d.getMonth()+1) + '/' + d.getDate());
  }
  return { start: start, days: 7, labels: labels };
}

var cache = {};
function startListen(){
  if (unsubscribe) unsubscribe();
  var cards = document.getElementById('cards');
  cards.innerHTML = '<div class="empty">連線中…</div>';
  unsubscribe = db.collection('users').onSnapshot(function(snap){
    cache = {};
    snap.forEach(function(doc){ cache[doc.id] = doc.data() || {}; });
    render();
  }, function(err){
    var msg = (err && err.message) ? err.message : String(err);
    document.getElementById('err').textContent = '讀取失敗：' + msg;
    cards.innerHTML = '<div class="empty" style="color:var(--red);">❌ 讀取 users 集合被拒絕<br><span style="font-size:12px;">' + esc(msg) + '</span><br><br><span style="color:var(--muted);font-size:12px;">這通常是 Firestore 安全規則擋住，請到 Firebase Console → Firestore → 規則，暫時改成：<br><code style="color:#f6ad55;">rules_version = \'2\';<br>service cloud.firestore {<br>&nbsp;&nbsp;match /databases/{database}/documents {<br>&nbsp;&nbsp;&nbsp;&nbsp;match /{document=**} {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;allow read, write: if true;<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;}<br>}</code></span></div>';
  });
}

function salesScoreForDay(d, dk){
  var settings = d.settings || {};
  var cutoff = Number(settings.salesCutoffHour) === 8 ? 8 : 0;
  var log = d.salesLog || {};
  if (cutoff === 8) {
    var next = new Date(dk); next.setDate(next.getDate() + 1);
    var nk = key(next);
    return (log[dk] || 0) + (log[nk] || 0);
  }
  return log[dk] || 0;
}
function taskScoreBreakdown(d, dk){
  var dt = new Date(dk + 'T00:00:00');
  var prevD = new Date(dt); prevD.setDate(dt.getDate() - 1);
  var prevKey = key(prevD);
  var snap = ((d.scoreLog || {})[dk] || {});
  var prevSnap = ((d.scoreLog || {})[prevKey] || {});
  var mk = dk.slice(0, 7);
  // 每日分數（普通/簡/加碼）：scoreLog 裡的值就是「當天」day-scope 任務清單算出來的完成分數，
  // 每天各自獨立（不是跨日累計），直接加總即可，不能再減前一天的值
  var day = Math.max(0, Number(snap.day) || 0);
  var easy = Math.max(0, Number(snap.easy) || 0);
  var bonus = Math.max(0, Number(snap.bonus) || 0);
  // 每週任務：快照差額歸到「實際達標的那一天」，同一週收過一次就不會在其他天重複出現
  var week = Math.max(0, (Number(snap.week) || 0) - (Number(prevSnap.week) || 0));
  // 每月任務：跨月時前一天的累計屬於上個月，歸零重算；同一月收過一次就不會在其他天重複出現
  var mPrev = (prevKey.slice(0,7) === mk) ? (Number(prevSnap.month) || 0) : 0;
  var month = Math.max(0, (Number(snap.month) || 0) - mPrev);
  return { day: day, easy: easy, bonus: bonus, week: week, month: month, total: day + easy + bonus + week + month };
}
function taskScoreForDay(d, dk){
  return taskScoreBreakdown(d, dk).total;
}
function weekKeyOf(dk){
  var d = new Date(dk + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return key(d);
}
function monthKeyOf(dk){ return dk.slice(0, 7); }

function render(){
  var r = rangeOf(period);
  var html = '';
  var count = 0;
  for (var uid in cache) {
    var d = cache[uid];
    var salesArr = [], tasksArr = [];
    for (var i = 0; i < r.days; i++) {
      var dk;
      if (period === 'month') { dk = key(new Date(r.base.getFullYear(), r.base.getMonth(), i+1)); }
      else { var dd = new Date(r.start); dd.setDate(r.start.getDate() + i); dk = key(dd); }
      salesArr.push(salesScoreForDay(d, dk));
      tasksArr.push(taskScoreForDay(d, dk));
    }
    var sSum = salesArr.reduce(function(a,b){ return a+b; }, 0);
    var tSum = tasksArr.reduce(function(a,b){ return a+b; }, 0);
    var name = d.nickname || '（未設暱稱）';
    var alias = d.alias ? ' ' + d.alias : '';
    var sMax = Math.max.apply(null, salesArr.concat([1]));
    var tMax = Math.max.apply(null, tasksArr.concat([1]));
    // 開播時數（每日分鐘 → 小時）＋ 滿時加分（每小時 +5）
    var hoursArr = [];
    for (var hi = 0; hi < r.days; hi++) {
      var hdk;
      if (period === 'month') { hdk = key(new Date(r.base.getFullYear(), r.base.getMonth(), hi+1)); }
      else { var hd = new Date(r.start); hd.setDate(r.start.getDate() + hi); hdk = key(hd); }
      var daySlots = ((d.dates || {})[hdk] || {}).slots;
      var mins = 0;
      (daySlots || []).forEach(function(sl){
        if (!sl || !sl.start || !sl.end) return;
        if (!sl.done) return; // 只計算「完成開播」打勾的時段
        var p = String(sl.start).split(':').map(Number), q = String(sl.end).split(':').map(Number);
        if (!Number.isFinite(p[0]) || !Number.isFinite(q[0])) return;
        var st = new Date(2000,0,1,p[0],p[1]||0), en = new Date(2000,0,1,q[0],q[1]||0);
        if (en > st) mins += Math.round((en - st) / 60000);
      });
      hoursArr.push(mins / 60);
    }
    var periodLabel = period === 'week'
      ? (weekOffset === 0 ? '本週' : (weekOffset === 1 ? '上週' : weekOffset + '週前'))
      : (monthOffset === 0 ? '本月' : (r.base.getMonth()+1) + '月');
    var hTotal = hoursArr.reduce(function(a,b){ return a+b; }, 0);
    var hFull = Math.floor(hTotal);
    var hLeft = Math.round((hTotal - hFull) * 60);
    var hPts = hFull * 5;
    var bars = '';
    for (var i2 = 0; i2 < r.days; i2++) {
      var hasAny = salesArr[i2] > 0 || tasksArr[i2] > 0;
      var hVal = hoursArr[i2];
      var dk2;
      if (period === 'month') { dk2 = key(new Date(r.base.getFullYear(), r.base.getMonth(), i2+1)); }
      else { var dd2 = new Date(r.start); dd2.setDate(r.start.getDate() + i2); dk2 = key(dd2); }
      bars += '<div class="bar-row"><span style="min-width:34px;">' + r.labels[i2] + '</span>'
        + '<div class="track"><div class="fill f-h" style="width:' + Math.min(100, Math.round(hVal/12*100)) + '%"></div></div>'
        + '<span style="min-width:36px;color:var(--blue);font-weight:700;">' + (hVal > 0 ? (Math.round(hVal*10)/10) + 'h' : '') + '</span>'
        + '<div class="track"><div class="fill f-s" style="width:' + Math.round(salesArr[i2]/sMax*100) + '%"></div></div>'
        + '<span style="min-width:36px;color:var(--accent2);font-weight:700;">' + (hasAny ? salesArr[i2] : '') + '</span>'
        + '<div class="track task-click" data-uid="' + uid + '" data-dk="' + dk2 + '" title="點看當天完成的任務／禮物" style="cursor:pointer;"><div class="fill f-t" style="width:' + Math.round(tasksArr[i2]/tMax*100) + '%"></div></div>'
        + '<span class="task-click" data-uid="' + uid + '" data-dk="' + dk2 + '" title="點看當天完成的任務／禮物" style="min-width:36px;color:var(--accent);font-weight:700;cursor:pointer;">' + (hasAny ? tasksArr[i2] : '') + '</span></div>';
    }
    var roomSel = '<select data-room-uid="' + uid + '" class="room-select" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:4px 8px;font-size:12px;outline:none;margin-left:auto;">'
      + '<option value="未知"' + ((d.room || '未知') === '未知' ? ' selected' : '') + '>未知</option>'
      + '<option value="野蠻女友"' + (d.room === '野蠻女友' ? ' selected' : '') + '>野蠻女友</option>'
      + '</select>';
    html += '<div class="host-card"><h3 style="display:flex;align-items:center;gap:8px;">' + esc(name) + esc(alias) + roomSel + '</h3>'
      + '<div class="email">' + esc(d.email || '') + '</div>'
      + '<div class="nums">'
      + '<div class="num"><div class="v c-sales">' + sSum + '</div><div class="l">' + periodLabel + '業績分數</div></div>'
      + '<div class="num"><div class="v c-tasks">' + tSum + '</div><div class="l">' + periodLabel + '任務分數</div></div>'
      + '<div class="num"><div class="v c-total">' + (tSum + hPts) + '</div><div class="l">' + periodLabel + '任務＋時數總分</div></div>'
      + '</div>'
      + '<div class="hours-line">📻 開播時數 <b class="h">' + hFull + ' 小時' + (hLeft ? ' ' + hLeft + ' 分' : '') + '</b>'
      + '　→　時數分數 <b class="p">+' + hPts + '</b><span class="muted">（每滿 1 小時 +5）</span></div>'
      + '<div class="muted" style="margin-top:8px;">每日：橘＝業績　紫＝任務　藍＝時數</div>'
      + '<div class="bar-wrap">' + bars + '</div></div>';
    count++;
  }
  if (!count) html = '<div class="empty">讀取成功，但目前 users 集合是空的（0 筆）<br>可能原因：<br>① Firestore 規則擋住讀取（上方應有紅字錯誤）<br>② 主播們還沒在新版 App 登入過（資料要登入後才會上雲）<br>③ 你登後台用的 Google 帳號跟 App 是不同專案？（apiKey 必須一致）</div>';
  cards.innerHTML = html;
}

// 當天完成任務／禮物明細（點任務分數條）
var GIFT_EMOJI = { '玫瑰':'🌹','火箭':'🚀','城堡':'🏰','金龍':'🐉','跑車':'🏎️','飛機':'✈️','遊艇':'🛥️','鑽戒':'💍','皇冠':'👑','煙花':'🎆','愛心':'❤️','禮物盒':'🎁' };
function taskRowHtml(t){
  var cur = Number(t.cur) || 0, target = Number(t.target) || 1;
  var done = cur >= target;
  var icon = t.icon && t.icon !== 'none' ? (GIFT_EMOJI[t.icon] || '') : '';
  return '<div style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">'
    + '<span style="font-size:16px;">' + (done ? '✅' : '⬜') + '</span>'
    + '<span style="flex:1;">' + (icon ? icon + ' ' : '') + esc(t.name) + '</span>'
    + '<span style="color:var(--muted);font-size:13px;white-space:nowrap;">' + cur + '/' + target + '・' + (Number(t.score) || 0) + '分</span>'
    + '</div>';
}
function showDayTasks(uid, dk){
  var d = cache[uid] || {};
  var name = d.nickname || '（未設暱稱）';
  var dayTasks = ((d.dates || {})[dk] || {}).tasks || [];
  var bd = taskScoreBreakdown(d, dk);
  document.getElementById('taskModalTitle').textContent = esc(name) + '・' + dk;
  var html = '';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:-2px;">🎁 每日任務</div>';
  html += dayTasks.length ? dayTasks.map(taskRowHtml).join('') : '<div class="muted" style="text-align:center;padding:8px 0;">這天沒有每日任務紀錄</div>';
  // 週／月任務只在「當週／當月新達成分數」的那一天顯示一次，避免同一份任務清單在其他天重複出現
  if (bd.week > 0) {
    var weekTasks = ((d.weeks || {})[weekKeyOf(dk)] || {}).tasks || [];
    html += '<div style="font-size:12px;color:var(--muted);margin:8px 0 -2px;">📅 本週任務（本週新達成 +' + bd.week + ' 分，只在達成當天顯示一次）</div>'
      + weekTasks.map(taskRowHtml).join('');
  }
  if (bd.month > 0) {
    var monthTasks = ((d.months || {})[monthKeyOf(dk)] || {}).tasks || [];
    html += '<div style="font-size:12px;color:var(--muted);margin:8px 0 -2px;">🗓️ 本月任務（本月新達成 +' + bd.month + ' 分，只在達成當天顯示一次）</div>'
      + monthTasks.map(taskRowHtml).join('');
  }
  document.getElementById('taskModalBody').innerHTML = html;
  document.getElementById('taskModal').style.display = 'flex';
}
document.getElementById('taskModalClose').onclick = function(){
  document.getElementById('taskModal').style.display = 'none';
};
document.getElementById('taskModal').addEventListener('click', function(e){
  if (e.target === this) this.style.display = 'none';
});
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.task-click') : null;
  if (!t) return;
  showDayTasks(t.getAttribute('data-uid'), t.getAttribute('data-dk'));
});

// 廳房選擇變更 → 寫回 Firebase
document.addEventListener('change', function(e){
  var t = e.target;
  if (!t || !t.classList || !t.classList.contains('room-select')) return;
  var uid = t.getAttribute('data-room-uid');
  db.collection('users').doc(uid).set({ room: t.value }, { merge: true }).then(function(){
    t.style.borderColor = 'var(--green)';
    setTimeout(function(){ t.style.borderColor = ''; }, 1200);
  }).catch(function(err){
    alert('儲存失敗：' + (err.message || err));
  });
});
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
</script>
</body>
</html>
